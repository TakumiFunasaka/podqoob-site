    <h1>今日の服</h1>

    <p class="lead">毎朝、その日の予定と天気から手持ちの服を1組選び、Google カレンダーに「今日の服」という終日予定として登録する、個人用のツールです。</p>

    <h2>できること</h2>
    <ul>
        <li>Google カレンダーからその日の予定を読み、場面（仕事・休日の外出など）を判定します</li>
        <li>予定の場所（なければ自宅）の天気を調べます</li>
        <li>手持ちの服のリストとルールから1組を選び、理由を添えてカレンダーに登録します</li>
    </ul>
